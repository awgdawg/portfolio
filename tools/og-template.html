<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    .og {
      width: 1200px;
      height: 630px;
      background: var(--bg);
      color: var(--text);
      padding: 64px 72px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .og::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 85% 15%, rgba(245,166,35,0.08) 0%, transparent 50%);
    }
    .og-top { display: flex; align-items: center; justify-content: space-between; }
    .og-brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
    .og-brand::before { content: '◣ '; color: var(--accent); }
    .og-status {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.15em;
      color: var(--live);
      text-transform: uppercase;
      padding: 6px 12px;
      border: 1px solid var(--live-border);
      border-radius: 4px;
    }
    .og-status::before { content: '● '; }
    .og-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 120px;
      line-height: 0.92;
      letter-spacing: -0.025em;
    }
    .og-tagline {
      font-size: 22px;
      color: var(--text-muted);
      line-height: 1.4;
      max-width: 880px;
      margin-top: 18px;
    }
    .og-kpis { display: flex; gap: 18px; }
    .og-kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 22px;
      flex: 1;
    }
    .og-kpi .lbl {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .og-kpi .val {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 36px;
      color: var(--accent);
      line-height: 1;
    }
    .og-kpi .unit {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div class="og">
    <div class="og-top">
      <div class="og-brand">aug.turner</div>
      <div class="og-status">Open to roles · BI / Analytics Engineering</div>
    </div>
    <div>
      <div class="og-name">August<br>Turner.</div>
      <p class="og-tagline">BI analyst — seven years building reliable analytics on healthcare and operational data. Snowflake · Power BI · OAC · SQL.</p>
    </div>
    <div class="og-kpis">
      <div class="og-kpi"><div class="lbl">// years</div><span class="val">7+</span></div>
      <div class="og-kpi"><div class="lbl">// pipelines</div><span class="val">20+</span></div>
      <div class="og-kpi"><div class="lbl">// dashboards</div><span class="val">15</span></div>
      <div class="og-kpi"><div class="lbl">// rows migrated</div><span class="val">10M+</span></div>
    </div>
  </div>
</body>
</html>
